services:
  nginx:
    image: nginx:stable
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build: ./api
    deploy: 
      replicas: 3
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=secret
    volumes:
      - ./logs:/logs
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=secret
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 2s
      retries: 10

  processor:
    build: ./processor
    deploy: 
      replicas: 4
    environment:
      - RABBITMQ_HOST=rabbitmq
      - NOTIFIER_URL=http://notifier:8001/notify
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=secret
    volumes:
      - ./logs:/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      notifier:
        condition: service_started

  notifier:
    build: ./notifier
    environment:
      - GMAIL_USER=jpcanonr@gmail.com
      # Es necesario crear App Password en la cuenta de Gmail para usar esta contraseña
      - GMAIL_PASS=hadujswbcsunmamd
    volumes:
      - ./logs:/logs
